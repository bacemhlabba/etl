<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics Dashboard - WideWorldImporters</title>
    <!-- Tailwind Play CDN with custom config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              },
              success: {
                500: '#10b981',
                600: '#059669',
              },
              warning: {
                500: '#f59e0b',
                600: '#d97706',
              },
              danger: {
                500: '#ef4444',
                600: '#dc2626',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Logo & Brand -->
          <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-primary-600 to-primary-700 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-chart-pie text-white text-lg"></i>
              </div>
              <div>
                <h1 class="text-lg font-bold text-gray-900">
                  Analytics Hub
                </h1>
                <p class="text-xs text-gray-500">WideWorldImporters</p>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center space-x-3">
            <button class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-primary-600 hover:bg-gray-50 rounded-lg transition-colors" onclick="location.reload()" title="Refresh data">
              <i class="fas fa-sync-alt mr-2"></i>
              <span class="hidden sm:inline">Refresh</span>
            </button>
            <button class="px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-lg shadow-sm transition-colors" title="Export report">
              <i class="fas fa-download mr-2"></i>
              <span class="hidden sm:inline">Export</span>
            </button>
            <div class="flex items-center space-x-2 px-3 py-1.5 bg-gray-50 rounded-lg">
              <i class="fas fa-clock text-primary-500 text-sm"></i>
              <span class="text-xs font-medium text-gray-600" id="current-time"></span>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-12 pb-6">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="border-t border-gray-200 pt-6">
          <div class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500">
            <div class="flex items-center space-x-2">
              <i class="fas fa-shield-alt text-primary-500"></i>
              <span>Powered by Flask, Tailwind CSS & Chart.js</span>
            </div>
            <div class="flex items-center space-x-4">
              <span>© 2025 WideWorldImporters</span>
              <span>•</span>
              <a href="#" class="hover:text-primary-600 transition-colors">Privacy</a>
              <span>•</span>
              <a href="#" class="hover:text-primary-600 transition-colors">Help</a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="/static/dashboard.js"></script>
    <script>
      // Update current time
      function updateTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        document.getElementById('current-time').textContent = `${hours}:${minutes}`;
      }
      updateTime();
      setInterval(updateTime, 1000);
    </script>
  </body>
</html>
